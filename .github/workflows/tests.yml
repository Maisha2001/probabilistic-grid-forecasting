name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: grid-forecast --help
  temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/dev.txt -r requirements/tracking.txt -r requirements/service.txt -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: grid-prob --help
      - run: grid-experiment --help
      - run: grid-pipeline --help
      - run: grid-serve --help
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
    env:
      MLFLOW_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
